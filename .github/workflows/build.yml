name: Build

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Ensure extension ABI compatibility
        # Fails if library/ API changes break existing extensions.
        run: ./gradlew library:checkKotlinAbi

      - name: Run unit tests
        run: ./gradlew testStableDebugUnitTest

      - name: Build release APK
        run: ./gradlew assembleStableRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cs-nerf-release-apk
          path: app/build/outputs/apk/stable/release/*.apk

      - name: Publish release
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: nerf-release
          prerelease: false
          title: cs-nerf Release Build
          files: app/build/outputs/apk/stable/release/*.apk
